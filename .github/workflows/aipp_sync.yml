name: AIPP State Sync to Google Drive

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Sync aipp_state.json with Google Drive
        env:
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'PY'
          import os, urllib.request, json, urllib.parse, sys
          from urllib.error import HTTPError

          refresh_token = os.environ.get("GCP_REFRESH_TOKEN", "").strip()
          folder_id = os.environ.get("GDRIVE_FOLDER_ID", "").strip()
          raw_creds = os.environ.get("GDRIVE_CREDENTIALS", "").strip()

          if not all([refresh_token, folder_id, raw_creds]):
              print("HATA: Gerekli GitHub Secrets okunamadı.")
              sys.exit(1)

          client_id = client_secret = None
          try:
              creds = json.loads(raw_creds)
              client_id = creds.get("client_id") or creds.get("installed", {}).get("client_id") or creds.get("web", {}).get("client_id")
              client_secret = creds.get("client_secret") or creds.get("installed", {}).get("client_secret") or creds.get("web", {}).get("client_secret")
          except json.JSONDecodeError:
              parts = raw_creds.replace(";", " ").split()
              if len(parts) >= 2:
                  client_id, client_secret = parts[0], parts[1]

          if not client_id or not client_secret:
              print("HATA: GDRIVE_CREDENTIALS içinden Client ID/Secret ayrıştırılamadı.")
              sys.exit(1)

          data = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type": "refresh_token"
          }).encode("utf-8")

          req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
          req.add_header("Content-Type", "application/x-www-form-urlencoded")
          try:
              res = urllib.request.urlopen(req)
              access_token = json.loads(res.read().decode("utf-8"))["access_token"]
              print("Access token başarıyla alındı.")
          except HTTPError as e:
              print("Google OAuth Hatası:", e.code)
              print("Detay:", e.read().decode("utf-8"))
              sys.exit(1)

          file_name = "aipp_state.json"
          query = f"name = '{file_name}' and '{folder_id}' in parents and trashed = false"
          search_url = f"https://www.googleapis.com/drive/v3/files?{urllib.parse.urlencode({'q': query})}"
          req = urllib.request.Request(search_url, headers={"Authorization": f"Bearer {access_token}"})
          try:
              response = urllib.request.urlopen(req)
              files = json.loads(response.read().decode("utf-8")).get("files", [])
          except HTTPError as e:
              print("Google Drive API Arama Hatası:", e.code)
              print("Detay:", e.read().decode("utf-8"))
              sys.exit(1)

          with open("aipp_state.json", "rb") as f:
              file_content = f.read()

          if files:
              file_id = files[0]["id"]
              print("Mevcut aipp_state.json güncelleniyor...")
              upload_url = f"https://www.googleapis.com/upload/drive/v3/files/{file_id}?uploadType=multipart"
              method = "PATCH"
              metadata = {"name": file_name}
          else:
              print("aipp_state.json oluşturuluyor...")
              upload_url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart"
              method = "POST"
              metadata = {"name": file_name, "parents": [folder_id]}

          boundary = "aipp_sync_boundary"
          body = (
              f"--{boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"
              f"{json.dumps(metadata)}\r\n"
              f"--{boundary}\r\nContent-Type: application/json\r\n\r\n"
          ).encode() + file_content + f"\r\n--{boundary}--\r\n".encode()

          req = urllib.request.Request(upload_url, data=body, method=method, headers={
              "Authorization": f"Bearer {access_token}",
              "Content-Type": f"multipart/related; boundary={boundary}"
          })
          try:
              resp = urllib.request.urlopen(req)
              print("Senkronizasyon başarıyla tamamlandı, HTTP Status:", resp.status)
          except HTTPError as e:
              print("Google Drive API Yükleme Hatası:", e.code)
              print("Detay:", e.read().decode("utf-8"))
              sys.exit(1)
          PY

name: AIPP State Sync to Google Drive

on:
  push:
    branches:
      - main
      - test/aipp-visible-write-20260821
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prove checked-out revision
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          git rev-parse HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Sync aipp_state.json with Google Drive
        env:
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python - <<'EOF'
          import os, urllib.request, json, urllib.parse, sys
          from urllib.error import HTTPError

          refresh_token = os.environ.get("GCP_REFRESH_TOKEN", "").strip()
          folder_id = os.environ.get("GDRIVE_FOLDER_ID", "").strip()
          raw_creds = os.environ.get("GDRIVE_CREDENTIALS", "").strip()

          if not all([refresh_token, folder_id, raw_creds]):
              print("HATA: GitHub Secrets eksik okunuyor! Lütfen secret isimlerini kontrol et.")
              sys.exit(1)

          try:
              creds_json = json.loads(raw_creds)
              client_id = creds_json.get("client_id") or creds_json.get("installed", {}).get("client_id") or creds_json.get("web", {}).get("client_id")
              client_secret = creds_json.get("client_secret") or creds_json.get("installed", {}).get("client_secret") or creds_json.get("web", {}).get("client_secret")
          except json.JSONDecodeError:
              parts = raw_creds.replace(";", " ").split()
              if len(parts) >= 2:
                  client_id, client_secret = parts[0], parts[1]
              else:
                  print("HATA: GDRIVE_CREDENTIALS formatı anlaşılamadı.")
                  sys.exit(1)

          if not client_id or not client_secret:
              print("HATA: client_id veya client_secret ayrıştırılamadı. GDRIVE_CREDENTIALS içeriğini kontrol et.")
              sys.exit(1)

          data = urllib.parse.urlencode({
              "client_id": client_id,
              "client_secret": client_secret,
              "refresh_token": refresh_token,
              "grant_type": "refresh_token"
          }).encode("utf-8")

          req = urllib.request.Request("https://oauth2.googleapis.com/token", data=data)
          req.add_header("Content-Type", "application/x-www-form-urlencoded")

          try:
              res = urllib.request.urlopen(req)
              access_token = json.loads(res.read().decode("utf-8"))["access_token"]
              print("Access token başarıyla alındı.")
          except HTTPError as e:
              print("Google OAuth Hatası:", e.code)
              print("Detay:", e.read().decode("utf-8"))
              sys.exit(1)

          file_name = "aipp_state.json"
          query = f"name = '{file_name}' and '{folder_id}' in parents and trashed = false"
          search_url = f"https://www.googleapis.com/drive/v3/files?{urllib.parse.urlencode({'q': query})}"

          req = urllib.request.Request(search_url, headers={"Authorization": f"Bearer {access_token}"})
          try:
              response = urllib.request.urlopen(req)
              files = json.loads(response.read().decode("utf-8"))["files"]
          except HTTPError as e:
              print("Google Drive API Arama Hatası:", e.code)
              print("Detay:", e.read().decode("utf-8"))
              sys.exit(1)

          local_file_path = "aipp_state.json"
          if not os.path.exists(local_file_path):
              print("HATA: aipp_state.json checkout içinde bulunamadı.")
              sys.exit(1)

          with open(local_file_path, "rb") as f:
              file_content = f.read()

          if files:
              file_id = files[0]["id"]
              print(f"Mevcut dosya güncelleniyor (ID: {file_id})...")
              upload_url = f"https://www.googleapis.com/upload/drive/v3/files/{file_id}?uploadType=multipart"
              method = "PATCH"
              file_metadata = {"name": file_name}
          else:
              print("Yeni dosya oluşturuluyor...")
              upload_url = "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart"
              method = "POST"
              file_metadata = {"name": file_name, "parents": [folder_id]}

          boundary = "foo_bar_baz"
          body = (
              f"--{boundary}\r\n"
              f"Content-Type: application/json; charset=UTF-8\r\n\r\n"
              f"{json.dumps(file_metadata)}\r\n"
              f"--{boundary}\r\n"
              f"Content-Type: application/json\r\n\r\n"
          ).encode("utf-8") + file_content + f"\r\n--{boundary}--\r\n".encode("utf-8")

          req = urllib.request.Request(
              upload_url,
              data=body,
              headers={
                  "Authorization": f"Bearer {access_token}",
                  "Content-Type": f"multipart/related; boundary={boundary}"
              },
              method=method
          )

          try:
              resp = urllib.request.urlopen(req)
              print("Senkronizasyon başarıyla tamamlandı, HTTP Status:", resp.status)
          except HTTPError as e:
              print("Google Drive API Yükleme Hatası:", e.code)
              print("Detay:", e.read().decode("utf-8"))
              sys.exit(1)
          EOF
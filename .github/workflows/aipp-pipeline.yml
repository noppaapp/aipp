name: AIPP Autonomous Pipeline

on:
  push:
    branches:
      - test/aipp-visible-write-20260821
    paths-ignore:
      - aipp_state.json
  workflow_dispatch:
    inputs:
      command:
        description: "AIPP command"
        required: true
        default: "BAŞLA"
      task:
        description: "Task ID when required"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show checked-out revision
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          git log -1 --oneline
          test -f aipp_runner.py
          grep -q 'def initialize_state' aipp_runner.py

      - name: Validate canonical workspace
        run: |
          test -f AIPP.md
          test -f PROJECT_BOOT.md

      - name: Run AIPP
        env:
          AIPP_COMMAND: ${{ inputs.command || 'BAŞLA' }}
          AIPP_TASK: ${{ inputs.task || '' }}
        run: |
          if [ -n "$AIPP_TASK" ]; then
            python aipp_runner.py "$AIPP_COMMAND" --workspace "." --task "$AIPP_TASK"
          else
            python aipp_runner.py "$AIPP_COMMAND" --workspace "."
          fi

      - name: Show canonical state
        run: |
          cat aipp_state.json

      - name: Sync canonical state to Google Drive
        env:
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python drive_sync.py

      - name: Commit state artifact
        run: |
          git config user.name "AIPP Autonomous Runner"
          git config user.email "aipp-runner@users.noreply.github.com"
          git add aipp_state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore(aipp): update canonical state"
            git push
          fi

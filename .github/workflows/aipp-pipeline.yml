name: AIPP Autonomous Pipeline

# CI verification surface: core AIPP behavior is validated end-to-end.
# Post-merge main verification runs on tracked-path pushes to main.
on:
  workflow_dispatch:
    inputs:
      command:
        description: "AIPP command"
        required: false
        default: "BAŞLA"
      task:
        description: "Task ID when required"
        required: false
        default: ""
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "aipp_runner.py"
      - "aipp_drive_runtime.py"
      - "aipp_project_bootstrap.py"
      - "aipp_authority.py"
      - "runtime/**"
      - "ai/**"
      - "tests/**"
      - "panel/**"
      - "AIPP.md"
      - "AIPP_FINAL_READINESS.md"
      - ".github/workflows/aipp-pipeline.yml"

concurrency:
  group: aipp-autonomous-pipeline-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out revision
        run: |
          echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"
          echo "RUNTIME_SHA=$(git hash-object aipp_drive_runtime.py)"
          grep -n "DRIVE_PROJECT_BOOT_FOUND\|DRIVE_CANONICAL_STATE_PUBLISHED\|DRIVE_CANONICAL_STATE_READY" aipp_drive_runtime.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf

      - name: Pull canonical state from Google Drive
        env:
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python aipp_drive_runtime.py

      - name: Validate protocol workspace
        run: test -f AIPP.md

      - name: Run AIPP tests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m pytest -q

      - name: Run E2E session continuation proof
        run: python -m pytest -q -s tests/e2e/test_session_continuation.py

      - name: Run AIPP
        env:
          AIPP_COMMAND: ${{ inputs.command }}
          AIPP_TASK: ${{ inputs.task }}
        run: |
          command="${AIPP_COMMAND:-BAŞLA}"
          if [ -n "$AIPP_TASK" ]; then
            python aipp_runner.py "$command" --workspace "." --task "$AIPP_TASK"
          else
            python aipp_runner.py "$command" --workspace "."
          fi

      - name: Prove real external GitHub execution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          branch="aipp-proof/${GITHUB_RUN_ID}"
          python -c "from runtime.github_external import create_proof_branch; print('EXTERNAL_REF=' + create_proof_branch('${branch}'))"
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" --jq '.ref'
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          echo "EXTERNAL_GITHUB_ACTION=PASS"

      - name: Assert runtime state is ephemeral
        run: |
          if [ -e aipp_state.json ]; then
            echo "HALT: aipp_state.json must not exist in the execution workspace."
            exit 1
          fi
          echo "EPHEMERAL_STATE_ASSERTION=PASS"

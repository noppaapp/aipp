name: Run AIPP Google Drive Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-aipp-drive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth google-auth-httplib2 google-auth-oauthlib

      - name: Authenticate Service Account & Debug
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          python -c '
          import os
          creds = os.environ.get("GDRIVE_CREDENTIALS", "")
          print(f"GDRIVE_CREDENTIALS uzunluğu: {len(creds)}")
          if len(creds) == 0:
              print("HATA: GDRIVE_CREDENTIALS ortam değişkeni boş geliyor! GitHub Secrets ayarlarını kontrol edin.")
              exit(1)
          with open("service_account.json", "w", encoding="utf-8") as f:
              f.write(creds)
          print("service_account.json başarıyla yazıldı.")
          '

      - name: Run Runner
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python aipp_runner.py BAŞLA --workspace "."

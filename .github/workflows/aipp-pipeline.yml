name: AIPP Autonomous Pipeline

on:
  push:
    branches:
      - test/aipp-visible-write-20260821
    paths-ignore:
      - aipp_state.json
  workflow_dispatch:
    inputs:
      command:
        description: "AIPP command"
        required: true
        default: "BAŞLA"
      task:
        description: "Task ID when required"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: PROVE CHECKED OUT SOURCE
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "HEAD=$(git rev-parse HEAD)"
          git log -1 --oneline
          echo "--- initialize_state ---"
          grep -A 12 -B 3 'def initialize_state' aipp_runner.py
          echo "--- authority_gate references ---"
          grep -n 'authority_gate' aipp_runner.py

      - name: Validate canonical workspace
        run: |
          test -f AIPP.md
          test -f PROJECT_BOOT.md

      - name: Run AIPP
        env:
          AIPP_COMMAND: ${{ inputs.command || 'BAŞLA' }}
          AIPP_TASK: ${{ inputs.task || '' }}
        run: |
          if [ -n "$AIPP_TASK" ]; then
            python aipp_runner.py "$AIPP_COMMAND" --workspace "." --task "$AIPP_TASK"
          else
            python aipp_runner.py "$AIPP_COMMAND" --workspace "."
          fi

      - name: Show canonical state
        run: cat aipp_state.json

      - name: Commit state artifact
        run: |
          git config user.name "AIPP Autonomous Runner"
          git config user.email "aipp-runner@users.noreply.github.com"
          git add aipp_state.json
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore(aipp): update canonical state"
            git push
          fi

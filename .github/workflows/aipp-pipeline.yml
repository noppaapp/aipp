name: AIPP Autonomous Pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: "AIPP command"
        required: false
        default: "BAŞLA"
      task:
        description: "Task ID when required"
        required: false
        default: ""
  push:
    paths:
      - "aipp_runner.py"
      - "aipp_drive_runtime.py"
      - "AIPP.md"
      - "PROJECT_BOOT.md"
      - "aipp_state.json"
      - ".github/workflows/aipp-pipeline.yml"

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out revision
        run: |
          echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"
          echo "RUNTIME_SHA=$(git hash-object aipp_drive_runtime.py)"
          grep -n "DRIVE download\\|DRIVE_FILE_FOUND\\|PDF_MIME\\|ZIP_MIME" aipp_drive_runtime.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf

      - name: Pull canonical state from Google Drive
        env:
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python aipp_drive_runtime.py

      - name: Validate canonical workspace
        run: |
          test -f AIPP.md
          test -f PROJECT_BOOT.md

      - name: Run AIPP tests
        run: python -m pytest -q

      - name: Run E2E session continuation proof
        run: python -m pytest -q -s tests/e2e/test_session_continuation.py

      - name: Run AIPP
        env:
          AIPP_COMMAND: ${{ inputs.command }}
          AIPP_TASK: ${{ inputs.task }}
        run: |
          command="${AIPP_COMMAND:-BAŞLA}"
          if [ -n "$AIPP_TASK" ]; then
            python aipp_runner.py "$command" --workspace "." --task "$AIPP_TASK"
          else
            python aipp_runner.py "$command" --workspace "."
          fi

      - name: Show canonical state
        run: cat aipp_state.json

      - name: Commit state artifact
        run: |
          git config user.name "AIPP Autonomous Runner"
          git config user.email "aipp-runner@users.noreply.github.com"
          git add aipp_state.json
          if [ -d artifacts ]; then
            git add artifacts/
          fi
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore(aipp): update execution state"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict detected; preserving this run's generated state artifact."
              git checkout --theirs -- aipp_state.json
              git add aipp_state.json
              git rebase --continue
            fi
            git push origin HEAD:main
          fi

import os
import sys
import json
import argparse
import io
from google.oauth2 import service_account
from googleapiclient.discovery import build
from googleapiclient.http import MediaIoBaseUpload

SCOPES = ['https://www.googleapis.com/auth/drive.file']

def get_drive_service():
    creds_path = 'service_account.json'
    if not os.path.exists(creds_path):
        raise FileNotFoundError(f"Kimlik dosyası bulunamadı: {creds_path}")
    creds = service_account.Credentials.from_service_account_file(creds_path, scopes=SCOPES)
    return build('drive', 'v3', credentials=creds)

def upload_or_update_file(service, folder_id, filename, content, mimetype):
    # İçeriği byte akışına dönüştür
    if isinstance(content, str):
        media_content = io.BytesIO(content.encode('utf-8'))
    else:
        media_content = io.BytesIO(content)

    media = MediaIoBaseUpload(media_content, mimetype=mimetype, resumable=True)
    
    # KRİTİK DÜZELTME: Dosyanın hangi klasöre yükleneceğini belirtiyoruz
    file_metadata = {
        'name': filename,
        'parents': [folder_id]
    }

    file = service.files().create(
        body=file_metadata,
        media_body=media,
        fields='id'
    ).execute()
    
    print(f"Dosya başarıyla yüklendi! Drive Dosya ID: {file.get('id')}")

def main():
    parser = argparse.ArgumentParser(description="AIPP Runner")
    parser.add_argument("command", nargs="?", default="BAŞLA")
    parser.add_argument("--workspace", default=".")
    args = parser.parse_args()

    print(f"Çalıştırılıyor: Komut={args.command}, Workspace={args.workspace}")

    # GitHub Secrets'tan gelen GDRIVE_FOLDER_ID değerini ortam değişkeninden alıyoruz
    folder_id = os.environ.get("GDRIVE_FOLDER_ID")
    if not folder_id:
        raise ValueError("GDRIVE_FOLDER_ID ortam değişkeni bulunamadı! Lütfen GitHub Secrets ayarlarını kontrol edin.")

    service = get_drive_service()

    # Örnek durum (state) verisi
    state_data = {
        "status": "RUNNING",
        "command": args.command,
        "workspace": args.workspace
    }
    state_json = json.dumps(state_data, indent=2)

    # Google Drive'a yükleme fonksiyonunu çağır
    upload_or_update_file(service, folder_id, "aipp_state.json", state_json, "application/json")

if __name__ == "__main__":
    main()

name: AIPP Autonomous Pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: "AIPP command"
        required: true
        default: "BAŞLA"
      task:
        description: "Task ID when required"
        required: false
        default: ""

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Validate canonical workspace
        run: |
          test -f AIPP.md
          test -f PROJECT_BOOT.md

      - name: Run AIPP tests
        run: pytest -q

      - name: Run AIPP
        run: |
          if [ -n "${{ inputs.task }}" ]; then
            python aipp_runner.py "${{ inputs.command }}" \
              --workspace "." \
              --task "${{ inputs.task }}"
          else
            python aipp_runner.py "${{ inputs.command }}" \
              --workspace "."
          fi

      - name: Show canonical state
        run: cat aipp_state.json

      - name: Commit state artifact
        run: |
          git config user.name "AIPP Autonomous Runner"
          git config user.email "aipp-runner@users.noreply.github.com"
          git add aipp_state.json artifacts/
          if git diff --cached --quiet; then
            echo "No state change."
          else
            git commit -m "chore(aipp): update execution state"
            git push
          fi

name: AIPP Autonomous Pipeline

on:
  workflow_dispatch:
    inputs:
      command:
        description: "AIPP command"
        required: false
        default: "BAŞLA"
      task:
        description: "Task ID when required"
        required: false
        default: ""
  push:
    paths:
      - "aipp_runner.py"
      - "aipp_drive_runtime.py"
      - "aipp_project_bootstrap.py"
      - "AIPP.md"
      - ".github/workflows/aipp-pipeline.yml"

concurrency:
  group: aipp-autonomous-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify checked-out revision
        run: |
          echo "CHECKED_OUT_COMMIT=$(git rev-parse HEAD)"
          echo "RUNTIME_SHA=$(git hash-object aipp_drive_runtime.py)"
          grep -n "DRIVE_PROJECT_BOOT_FOUND\\|DRIVE_CANONICAL_STATE_PUBLISHED\\|DRIVE_CANONICAL_STATE_READY" aipp_drive_runtime.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest pypdf

      - name: Pull canonical state from Google Drive
        env:
          GCP_REFRESH_TOKEN: ${{ secrets.GCP_REFRESH_TOKEN }}
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python aipp_drive_runtime.py

      - name: Validate protocol workspace
        run: test -f AIPP.md

      - name: Run AIPP tests
        run: python -m pytest -q

      - name: Run E2E session continuation proof
        run: python -m pytest -q -s tests/e2e/test_session_continuation.py

      - name: Run AIPP
        env:
          AIPP_COMMAND: ${{ inputs.command }}
          AIPP_TASK: ${{ inputs.task }}
        run: |
          command="${AIPP_COMMAND:-BAŞLA}"
          if [ -n "$AIPP_TASK" ]; then
            python aipp_runner.py "$command" --workspace "." --task "$AIPP_TASK"
          else
            python aipp_runner.py "$command" --workspace "."
          fi

      - name: Assert runtime state is ephemeral
        run: |
          if [ -e aipp_state.json ]; then
            echo "HALT: aipp_state.json must not exist in the execution workspace."
            exit 1
          fi
          echo "EPHEMERAL_STATE_ASSERTION=PASS"

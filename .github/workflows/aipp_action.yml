name: Run AIPP Autonomous Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-aipp:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run AIPP Runner
        run: |
          python aipp_runner.py BAŞLA --workspace "."

      - name: Commit and push generated files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add aipp_state.json baglanti_testi.txt
          git diff --quiet && git diff --staged --quiet || git commit -m "chore: update AIPP state and test output [skip ci]"
          git push

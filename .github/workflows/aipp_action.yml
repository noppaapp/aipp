name: Run AIPP Autonomous Pipeline

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-aipp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth

      - name: Create credentials.json from Secret
        run: |
          echo '${{ secrets.GDRIVE_CREDENTIALS }}' > credentials.json

      - name: Run AIPP Runner
        env:
          AIPP_ADAPTER: gdrive
          AIPP_GDRIVE_FOLDER: "1mSjaFfsLQHtp1uwmHRpStlSSNYUsvWT_"
        run: |
          python aipp_runner.py BAŞLA --workspace "."

name: AIPP Execution Proof

on:
  push:
    branches:
      - aipp/execution-engine-v1

jobs:
  execution-proof:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run unit tests
        run: pytest -q

      - name: Create isolated execution fixture
        run: |
          mkdir -p proof-workspace
          cp AIPP.md proof-workspace/AIPP.md
          cp PROJECT_BOOT.md proof-workspace/PROJECT_BOOT.md
          cat > proof-workspace/aipp_state.json <<'EOF'
          {
            "version": "1.1.1",
            "status": "PROPOSAL_READY",
            "active_project": "AIPP",
            "execution_mode": "REAL",
            "task_lifecycle": {
              "NOW": null,
              "DEFERRED": [],
              "BLOCKED": [],
              "FUTURE": [
                {"id": "AIPP-EXEC-001", "title": "Execution proof", "status": "FUTURE"}
              ],
              "REFERENCE": [],
              "COMPLETED": []
            },
            "authority_gate": {"pending_approval": null, "last_action": "INITIALIZATION"},
            "step": 1,
            "runner_engine": "GitHub Actions Autonomous Cloud Runner"
          }
          EOF

      - name: Execute complete AIPP lifecycle
        run: python aipp_runner.py RUN --task AIPP-EXEC-001 --workspace proof-workspace

      - name: Verify physical execution result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          state = json.loads(Path('proof-workspace/aipp_state.json').read_text(encoding='utf-8'))
          assert state['status'] == 'COMPLETED'
          assert state['task_lifecycle']['NOW'] is None
          completed = state['task_lifecycle']['COMPLETED']
          assert len(completed) == 1
          artifact = Path('proof-workspace') / completed[0]['artifact']
          assert artifact.exists()
          payload = json.loads(artifact.read_text(encoding='utf-8'))
          assert payload['task_id'] == 'AIPP-EXEC-001'
          assert payload['result'] == 'EXECUTED'
          print('AIPP PHYSICAL EXECUTION PROOF: PASS')
          PY
